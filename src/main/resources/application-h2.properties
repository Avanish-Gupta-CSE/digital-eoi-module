# Local development profile: in-memory H2, no bank VPN, no Oracle.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:eoidev;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Only the h2 profile loads mock data. Business code never invents a number.
# Schema is split by Annex II part and must run in this order: parents before children.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql,classpath:db/schema-annexii-exposure.sql,classpath:db/schema-annexii-experience.sql,classpath:db/schema-audit.sql
spring.sql.init.data-locations=classpath:db/h2-init.sql

# Handy while developing; disabled outside this profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
