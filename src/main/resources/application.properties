# Defaults for every profile. Nothing here is bank-specific.
spring.application.name=digital-eoi

# UAT defaults. Every value can be overridden by an environment variable,
# so the same build runs on a laptop and on the UAT server unchanged.
server.port=${SERVER_PORT:8082}
spring.datasource.url=${EOI_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${EOI_DB_USER:uco_eoi}
spring.datasource.password=${EOI_DB_PASSWORD:uco_eoi_pwd}

# The Oracle schema is created by db_migrations/01_CREATE_EOI_TABLES.sql, not by
# the application. Never let the app create or drop tables in UAT.
spring.sql.init.mode=never

# JSP views live here. Markup only - no logic in a JSP.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Every unknown business rule is a property, so an answer from the bank is a one-line change.
eoi.borrower-threshold-amount=50000000
eoi.rounding-scale=2
# Open question #4 on the board: fixed as-on dates or rolling. Until the bank answers,
# the quarter is configuration, not code.
eoi.current-quarter=Q3FY2627

# Bank single sign-on. The gateway sends the officer to /entry?Value=... with an
# AES/GCM token. The key is never in this file; it comes from the environment.
sso.encryption.key=${SSO_ENC_KEY:}
uco.sso.dev-login-enabled=${DEV_LOGIN_ENABLED:false}
uco.sso.test-otp=${TEST_OTP:123456}
uco.sso.hrms-schema=${EOI_HRMS_SCHEMA:HRMS_DBA}
uco.sso.auth-required=${EOI_AUTH_REQUIRED:true}

# No secrets here. Values come from the environment or the profile file.
logging.level.root=INFO

# Local development on H2 (in-memory, no Oracle, no bank VPN).
# Uncomment to run against H2 instead of the Oracle UAT defaults above.
# spring.profiles.active=h2
